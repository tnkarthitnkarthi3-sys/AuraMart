        .summary {
            margin-top: 25px;

            font-size: 24px;

            background: #16a34a;

        }

        .empty {
            text-align: center;

        }
    </style>
</head>

<body>

<header>

    <div class="logo">AuraMart</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="login.html">Login</a>
        <a href="orders.html">Orders</a>
    </nav>

</header>

<div class="container">

    <h1>🛒 Your Shopping Cart</h1>

    <div id="cartItems"></div>

    <div class="summary">

        <div class="total">
            Total: ₹<span id="total">0</span>
        </div>

        <button class="checkout" onclick="placeOrder()">
            Place Order
        </button>

    </div>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("auraMartCart")) || [];

function displayCart() {

    const cartItems = document.getElementById("cartItems");

    cartItems.innerHTML = "";

    if (cart.length === 0) {

        cartItems.innerHTML = `
            <div class="empty">
                <h2>Your cart is empty 😔</h2>
                <br>
                <a href="products.html">Continue Shopping</a>
            </div>
        `;

        document.getElementById("total").innerText = "0";
        return;
    }

    let total = 0;

    cart.forEach((item, index) => {

        const price = Number(item.price) || 0;
        const quantity = Number(item.quantity) || 1;

        total += price * quantity;

        cartItems.innerHTML += `

            <div class="cart-item">

                <div>
                    <div class="item-name">${item.name}</div>

                    <div class="item-price">
                        ₹${price}
                    </div>
                </div>

                <div class="quantity">

                    <button onclick="changeQuantity(${index}, -1)">−</button>

                    <span>${quantity}</span>

                    <button onclick="changeQuantity(${index}, 1)">+</button>

                </div>

                <button class="remove"
                    onclick="removeItem(${index})">
                    Remove
                </button>

            </div>
        `;
    });

    document.getElementById("total").innerText = total;

}

function changeQuantity(index, change) {

    cart[index].quantity = (Number(cart[index].quantity) || 1) + change;

    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }

    saveCart();
}

function removeItem(index) {

    cart.splice(index, 1);

    saveCart();
}

function saveCart() {

    localStorage.setItem(
        "auraMartCart",
        JSON.stringify(cart)
    );

    displayCart();
}

function placeOrder() {

    if (cart.length === 0) {

        alert("Your cart is empty!");

        return;
    }

    const user =
        JSON.parse(localStorage.getItem("auraMartUser"));

    if (!user || !user.loggedIn) {

        alert("Please login before placing your order.");

        window.location.href = "login.html";

        return;
    }

    const orders =
        JSON.parse(localStorage.getItem("auraMartOrders")) || [];

    const total =
        cart.reduce((sum, item) =>
            sum + (Number(item.price) * (Number(item.quantity) || 1)), 0);

    const newOrder = {

        orderId: "AM" + Date.now(),

        date: new Date().toLocaleString(),

        items: cart,

        total: total,

        status: "Order Placed"

    };

    orders.push(newOrder);

    localStorage.setItem(
        "auraMartOrders",
        JSON.stringify(orders)
    );

    localStorage.removeItem("auraMartCart");

    alert("🎉 Order placed successfully!");

    window.location.href = "orders.html";
}

displayCart();

</script>

</body>
</html>
