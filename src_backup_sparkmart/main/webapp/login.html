<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AuraMart | Login</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#eef2ff,#f8fafc);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.login-box{
    width:100%;
    max-width:430px;
    background:white;
    padding:42px;
    border-radius:22px;
    box-shadow:0 20px 60px rgba(15,23,42,.15);
}

.logo{
    text-align:center;
    font-size:34px;
    font-weight:bold;
    color:#4f46e5;
}

.title{
    text-align:center;
    margin-top:8px;
    font-size:24px;
    color:#1e293b;
    font-weight:bold;
}

.subtitle{
    text-align:center;
    color:#64748b;
    margin-top:7px;
    margin-bottom:28px;
}

label{
    display:block;
    margin:16px 0 7px;
    font-weight:bold;
    color:#334155;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#4f46e5;
    box-shadow:0 0 0 3px rgba(79,70,229,.1);
}

button{
    width:100%;
    padding:14px;
    margin-top:24px;
    border:0;
    border-radius:10px;
    background:#4f46e5;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#3730a3;
}

.register{
    text-align:center;
    margin-top:22px;
    color:#64748b;
    font-size:14px;
}

.register a{
    color:#4f46e5;
    text-decoration:none;
    font-weight:bold;
}

.home{
    display:block;
    text-align:center;
    margin-top:15px;
    color:#64748b;
    text-decoration:none;
    font-size:14px;
}

.error{
    margin-top:18px;
    padding:12px;
    border-radius:9px;
    background:#fee2e2;
    color:#b91c1c;
    text-align:center;
    font-size:14px;
}

.success{
    margin-top:18px;
    padding:12px;
    border-radius:9px;
    background:#dcfce7;
    color:#166534;
    text-align:center;
    font-size:14px;
}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        AuraMart
    </div>

    <div class="title">
        Welcome Back
    </div>

    <div class="subtitle">
        Login to your customer account
    </div>

    <form action="login" method="post">
        <input type="hidden" id="checkout" name="checkout" value="false">

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            Login to AuraMart
        </button>

    </form>

    <div id="message"></div>

    <div class="register">
        Don't have an account?
        <a href="register.html">
            Create Account
        </a>
    </div>

    <a href="index.html" class="home">
        ? Back to Home
    </a>

</div>

<script>

const params =
    new URLSearchParams(window.location.search);

const message =
    document.getElementById("message");

const checkoutField =
    document.getElementById("checkout");

if(params.get("checkout") === "true"){
    checkoutField.value = "true";
}

if(params.get("error") === "invalid"){

    message.className = "error";

    message.innerText =
        "Invalid email or password.";

}

if(params.get("registered") === "true"){

    message.className = "success";

    message.innerText =
        "Account created successfully. Please login.";

}

</script>

</body>
</html>
