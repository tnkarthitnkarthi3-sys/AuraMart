<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AuraMart - My Orders</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f8fafc;
    color:#1e293b;
}

header{
    background:#111827;
    color:white;
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:27px;
    font-weight:bold;
}

nav{
    display:flex;
    gap:20px;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

.container{
    max-width:1000px;
    margin:40px auto;
    padding:20px;
}

h1{
    margin-bottom:25px;
}

.welcome{
    background:#eef2ff;
    padding:15px 20px;
    border-radius:10px;
    margin-bottom:25px;
    color:#3730a3;
}

.order{
    background:white;
    padding:25px;
    margin-bottom:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.order-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:15px;
    gap:15px;
}

.order-id{
    font-weight:bold;
    color:#4f46e5;
    margin-bottom:5px;
}

.status{
    color:#166534;
    font-weight:bold;
    background:#dcfce7;
    padding:7px 12px;
    border-radius:20px;
}

.customer-box{
    background:#f8fafc;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    line-height:1.7;
}

.customer-box h3{
    margin-bottom:8px;
}

.product{
    padding:12px 0;
    border-bottom:1px solid #e2e8f0;
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.product:last-child{
    border-bottom:none;
}

.product-name{
    font-weight:bold;
}

.product-price{
    color:#e11d48;
    font-weight:bold;
}

.total{
    text-align:right;
    font-size:21px;
    font-weight:bold;
    margin-top:18px;
    color:#111827;
}

.empty,
.loading{
    background:white;
    padding:60px;
    text-align:center;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.empty h2{
    margin-bottom:10px;
}

.empty p{
    color:#64748b;
    margin-top:8px;
}

.shop{
    display:inline-block;
    margin-top:20px;
    background:#4f46e5;
    color:white;
    padding:12px 20px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:700px){

    header{
        flex-direction:column;
        gap:15px;
    }

    nav{
        flex-wrap:wrap;
        justify-content:center;
    }

    .order-header{
        flex-direction:column;
    }

    .product{
        flex-direction:column;
    }

}

</style>
<style>
body{
    background:linear-gradient(135deg,#eef4ff 0%,#f8fafc 45%,#fef3c7 100%) !important;
}

header{
    background:linear-gradient(135deg,#1d4ed8,#4f46e5,#7c3aed) !important;
    padding:16px 6% !important;
}

.logo{
    font-size:30px !important;
    letter-spacing:.3px;
}

.container{
    max-width:1150px !important;
}

.topbar{
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(8px);
    padding:20px;
    border-radius:16px;
    margin-bottom:18px;
    box-shadow:0 8px 25px rgba(15,23,42,.08);
}

.title h1{
    color:#111827;
    font-size:32px;
}

.welcome{
    background:linear-gradient(135deg,#dbeafe,#ede9fe) !important;
    border:1px solid #c7d2fe !important;
    color:#312e81 !important;
}

.toolbar{
    border:1px solid #e2e8f0;
    background:rgba(255,255,255,.92) !important;
}

.order{
    border:1px solid #e2e8f0;
    transition:transform .2s ease,box-shadow .2s ease;
}

.order:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 30px rgba(37,99,235,.14);
}

.order-head{
    background:linear-gradient(135deg,#eff6ff,#f5f3ff) !important;
}

.status.placed{
    background:#dcfce7 !important;
    color:#166534 !important;
}

.product{
    padding:16px 0 !important;
}

.product-image{
    width:92px !important;
    height:92px !important;
    padding:8px !important;
    border:2px solid #e0e7ff !important;
    background:linear-gradient(135deg,#fff,#f8fafc) !important;
    box-shadow:0 3px 10px rgba(15,23,42,.08);
    transition:transform .2s ease;
}

.product:hover .product-image{
    transform:scale(1.06);
}

.product-name{
    font-size:15px !important;
    color:#111827;
}

.product-price{
    color:#e11d48 !important;
    font-size:16px;
}

.customer{
    background:linear-gradient(135deg,#f8fafc,#eef2ff) !important;
    border-color:#dbeafe !important;
}

.section-title{
    color:#1e3a8a;
    font-weight:800;
}

.summary-box{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:12px;
    padding:12px 15px;
}

.row.total{
    color:#111827 !important;
}

.btn-primary{
    background:linear-gradient(135deg,#2563eb,#4f46e5) !important;
}

.btn-secondary{
    background:linear-gradient(135deg,#f59e0b,#f97316) !important;
}

.btn-light{
    border:1px solid #c7d2fe !important;
}

.timeline{
    margin:18px 0 24px !important;
}

.step.active span{
    color:#166534 !important;
    font-weight:700;
}

.empty{
    background:rgba(255,255,255,.92) !important;
}

.empty-icon{
    font-size:56px !important;
}

@media(max-width:750px){
    .title h1{
        font-size:25px;
    }

    .product{
        align-items:flex-start !important;
    }

    .product-image{
        width:72px !important;
        height:72px !important;
    }
}
</style></head>

<body>

<header>

<div class="logo">
AuraMart
</div>

<nav>
<a href="index.html">Home</a>
<a href="products">Products</a>
<a href="cart.html">Cart</a>
<a href="orders.html">Orders</a>
<a href="login.html">Login</a>
</nav>

</header>

<div class="container">

<h1>My Orders</h1><p>Track your purchases, delivery status and order details</p>

<div id="welcome"></div>

<div id="orders">
    <div class="loading">
        Loading your orders...
    </div>
</div>

</div>

<script>

const ordersContainer =
    document.getElementById("orders");

const welcomeContainer =
    document.getElementById("welcome");


function money(value){

    return Number(value || 0)
        .toLocaleString("en-IN");

}


function showEmpty(){

    ordersContainer.innerHTML = `

        <div class="empty">

            <h2>No orders yet</h2>

            <p>
                Your placed orders will appear here.
            </p>

            <a
                href="products"
                class="shop"
            >
                Continue Shopping
            </a>

        </div>

    `;

}


function renderOrders(data){

    if(!data.orders ||
       data.orders.length === 0){

        showEmpty();

        return;
    }


    ordersContainer.innerHTML = "";


    data.orders.forEach(function(order){

        let productsHTML = "";


        (order.items || []).forEach(
            function(item){

                const quantity =
                    Number(item.quantity) || 1;

                const price =
                    Number(item.price) || 0;

                const itemTotal =
                    price * quantity;


                productsHTML += `

                    <div class="product">

                        <div>

                            <div class="product-name">
                                ${item.name || "Product"}
                            </div>

                            <small>
                                Rs. ${money(price)}
                                x ${quantity}
                            </small>

                        </div>

                        <div class="product-price">
                            Rs. ${money(itemTotal)}
                        </div>

                    </div>

                `;

            }
        );


        const customer =
            order.customer || {};


        ordersContainer.innerHTML += `

            <div class="order">

                <div class="order-header">

                    <div>

                        <div class="order-id">
                            Order ID: ${order.orderId}
                        </div>

                        <small>
                            ${order.createdAt || ""}
                        </small>

                    </div>

                    <div class="status">
                        ${order.status || "PLACED"}
                    </div>

                </div>


                <div class="customer-box">

                    <h3>
                        Delivery Details
                    </h3>

                    <p>
                        <strong>Name:</strong>
                        ${customer.name || ""}
                    </p>

                    <p>
                        <strong>Email:</strong>
                        ${customer.email || ""}
                    </p>

                    <p>
                        <strong>Phone:</strong>
                        ${customer.phone || ""}
                    </p>

                    <p>
                        <strong>Address:</strong>
                        ${order.address || ""}
                    </p>

                </div>


                <h3 style="margin-bottom:10px;">
                    Products
                </h3>

                ${productsHTML}


                <div class="total">

                    Subtotal:
                    Rs. ${money(order.subtotal)}
                    <br>

                    Delivery:
                    Rs. ${money(order.deliveryCharge)}
                    <br>

                    Service:
                    Rs. ${money(order.serviceCharge)}
                    <br>

                    <strong>
                        Total:
                        Rs. ${money(order.total)}
                    </strong>

                </div>

            </div>

        `;

    });

}


/* Clear cart only after successful order */
const orderParams =
    new URLSearchParams(
        window.location.search
    );

if(
    orderParams.get("success") === "true"
){
    localStorage.removeItem(
        "auraMartCart"
    );

    localStorage.removeItem(
        "auraMartCheckout"
    );
}
fetch(
    "orders-data",
    {
        method:"GET",
        credentials:"include",
        cache:"no-store"
    }
)
.then(function(response){

    if(response.status === 401){

        throw new Error("LOGIN_REQUIRED");
    }

    if(!response.ok){

        throw new Error("ORDER_DATA_ERROR");
    }

    return response.json();

})
.then(function(data){

    welcomeContainer.innerHTML = `

        <div class="welcome">

            Welcome,
            <strong>${data.user.name}</strong>
            (${data.user.email})

        </div>

    `;


    renderOrders(data);

})
.catch(function(error){

    console.error(error);

    if(error.message === "LOGIN_REQUIRED"){

        ordersContainer.innerHTML = `

            <div class="empty">

                <h2>Please login</h2>

                <p>
                    Login to view your orders.
                </p>

                <a
                    href="login.html"
                    class="shop"
                >
                    Login Now
                </a>

            </div>

        `;

        return;
    }


    showEmpty();

});

</script>

</body>

</html>
