name: Deploy AuraMart to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare AuraMart website
        run: |
          mkdir -p _site
          cp index.html _site/
          cp login.html _site/
          cp register.html _site/
          cp products.html _site/
          cp cart.html _site/
          cp orders.html _site/
          cp script.js _site/
          cp -r images _site/

      - name: Upload AuraMart website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4