```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AuraMart - Orders</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8fafc;
            color: #1e293b;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .order {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .order-id {
            font-weight: bold;
            color: #4f46e5;
        }

        .status {
            color: #16a34a;
            font-weight: bold;
        }

        .product {
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
        }

        .empty {
            background: white;
            padding: 60px;
            text-align: center;
            border-radius: 14px;
        }

        .shop {
            display: inline-block;
            margin-top: 20px;
            background: #4f46e5;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
        }

    </style>

</head>

<body>

<header>

    <div class="logo">AuraMart</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="login.html">Login</a>
    </nav>

</header>

<div class="container">

    <h1>📦 My Orders</h1>

    <div id="orders"></div>

</div>

<script>

const orders =
    JSON.parse(localStorage.getItem("auraMartOrders")) || [];

const ordersContainer =
    document.getElementById("orders");

if (orders.length === 0) {

    ordersContainer.innerHTML = `

        <div class="empty">

            <h2>No orders yet 😔</h2>

            <p>Start shopping and place your first order!</p>

            <a href="products.html" class="shop">
                Shop Now
            </a>

        </div>

    `;

} else {

    orders.reverse().forEach(order => {

        let productsHTML = "";

        order.items.forEach(item => {

            const quantity =
                Number(item.quantity) || 1;

            productsHTML += `

                <div class="product">

                    ${item.name}

                    × ${quantity}

                    — ₹${Number(item.price) * quantity}

                </div>

            `;

        });

        ordersContainer.innerHTML += `

            <div class="order">

                <div class="order-header">

                    <div>

                        <div class="order-id">
                            Order ID: ${order.orderId}
                        </div>

                        <small>
                            ${order.date}
                        </small>

                    </div>

                    <div class="status">
                        ✓ ${order.status}
                    </div>

                </div>

                ${productsHTML}

                <div class="total">
                    Total: ₹${order.total}
                </div>

            </div>

        `;

    });

}

</script>

</body>
</html>
```
