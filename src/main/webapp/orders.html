<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<title>AuraMart - My Orders</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html{scroll-behavior:smooth}

body{
    min-height:100vh;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    color:#f8fafc;
    background:
        radial-gradient(circle at 10% 10%,rgba(124,58,237,.25),transparent 28%),
        radial-gradient(circle at 90% 20%,rgba(37,99,235,.22),transparent 28%),
        radial-gradient(circle at 50% 100%,rgba(168,85,247,.18),transparent 30%),
        linear-gradient(135deg,#020617,#0b1024 48%,#111827);
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:-100px;
    pointer-events:none;
    opacity:.5;
    background:
        repeating-linear-gradient(
            110deg,
            rgba(255,255,255,.035) 0,
            rgba(255,255,255,.035) 1px,
            transparent 1px,
            transparent 8px
        ),
        repeating-linear-gradient(
            20deg,
            rgba(255,255,255,.025) 0,
            rgba(255,255,255,.025) 1px,
            transparent 1px,
            transparent 10px
        );
    transform:rotate(-3deg) scale(1.2);
}

body:after{
    content:"";
    position:fixed;
    width:420px;
    height:420px;
    right:-150px;
    top:80px;
    border-radius:50%;
    background:rgba(124,58,237,.16);
    filter:blur(90px);
    pointer-events:none;
}

a{
    color:inherit;
    text-decoration:none;
}

header,
nav,
footer{
    position:relative;
    z-index:2;
}

header{
    padding:22px 7%;
    background:rgba(2,6,23,.62);
    border-bottom:1px solid rgba(255,255,255,.09);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
}

header a:first-child,
nav a:first-child{
    font-weight:900;
    font-size:22px;
    letter-spacing:-.5px;
}

nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:30px;
    padding:15px 7%;
    background:rgba(15,23,42,.5);
    border-bottom:1px solid rgba(255,255,255,.07);
    backdrop-filter:blur(20px);
}

nav a{
    color:#cbd5e1;
    font-size:14px;
    font-weight:700;
    transition:.25s;
}

nav a:hover{
    color:#fff;
    transform:translateY(-1px);
}

main,
.container{
    width:min(1120px,92%);
    margin:0 auto;
    padding:55px 0 80px;
    position:relative;
    z-index:1;
}

h1{
    font-size:clamp(34px,5vw,58px);
    font-weight:900;
    letter-spacing:-2px;
    line-height:1.05;
    margin-bottom:10px;
    background:linear-gradient(90deg,#fff,#c4b5fd,#93c5fd);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

main>p,
.container>p{
    color:#94a3b8;
    font-size:16px;
    margin-bottom:35px;
}

#orders{
    display:grid;
    gap:28px;
}

.order{
    position:relative;
    overflow:hidden;
    padding:0;
    border:1px solid rgba(255,255,255,.11);
    border-radius:26px;
    background:linear-gradient(
        145deg,
        rgba(255,255,255,.10),
        rgba(255,255,255,.035)
    );
    box-shadow:
        0 25px 70px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    transition:.35s ease;
}

.order:before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        120deg,
        transparent 25%,
        rgba(255,255,255,.06) 50%,
        transparent 75%
    );
    transform:translateX(-100%);
    transition:.8s;
    pointer-events:none;
}

.order:hover{
    transform:translateY(-6px);
    border-color:rgba(167,139,250,.38);
    box-shadow:
        0 30px 90px rgba(0,0,0,.45),
        0 0 35px rgba(124,58,237,.12);
}

.order:hover:before{
    transform:translateX(100%);
}

.order-header,
.order-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    padding:25px 28px;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.025);
}

.order-id{
    font-size:18px;
    font-weight:850;
    color:#fff;
}

.order-id small,
.order-header small,
.order-header span{
    color:#94a3b8;
}

.status{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:9px 16px;
    border-radius:999px;
    font-size:12px;
    font-weight:900;
    letter-spacing:.6px;
    color:#fff;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    box-shadow:0 8px 22px rgba(99,102,241,.25);
}

.status.placed{
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
}

.delivery-info{
    margin:24px 28px;
    padding:23px;
    border-radius:20px;
    border:1px solid rgba(96,165,250,.18);
    background:
        linear-gradient(
            135deg,
            rgba(59,130,246,.11),
            rgba(124,58,237,.09)
        );
}

.delivery-title{
    font-size:15px;
    font-weight:850;
    color:#e2e8f0;
    margin-bottom:12px;
}

.expected-delivery{
    color:#94a3b8;
    margin-bottom:22px;
}

.expected-delivery strong{
    display:inline-block;
    margin-left:6px;
    color:#c4b5fd;
    font-size:18px;
}

.delivery-timeline{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
    position:relative;
}

.delivery-timeline:before{
    content:"";
    position:absolute;
    top:19px;
    left:7%;
    right:7%;
    height:2px;
    background:rgba(148,163,184,.18);
}

.delivery-step{
    position:relative;
    z-index:1;
    flex:1;
    text-align:center;
    color:#64748b;
    font-size:10px;
    font-weight:800;
}

.delivery-step.completed,
.delivery-step.active{
    color:#e2e8f0;
}

.delivery-icon{
    width:38px;
    height:38px;
    margin:0 auto 9px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.12);
    background:#111827;
    box-shadow:0 5px 18px rgba(0,0,0,.25);
}

.delivery-step.completed .delivery-icon{
    background:linear-gradient(135deg,#22c55e,#16a34a);
    border-color:rgba(134,239,172,.4);
}

.delivery-step.active .delivery-icon{
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    border-color:rgba(196,181,253,.5);
    box-shadow:0 0 25px rgba(124,58,237,.35);
}

.delivery-label{
    line-height:1.3;
}

.product{
    display:flex;
    align-items:center;
    gap:18px;
    margin:0 28px;
    padding:22px 0;
    border-bottom:1px solid rgba(255,255,255,.07);
}

.product:last-child{
    border-bottom:none;
}

.product-image{
    width:86px;
    height:86px;
    object-fit:cover;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.12)!important;
    background:#111827;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
    transition:.3s;
}

.product:hover .product-image{
    transform:scale(1.05);
}

.product-name{
    flex:1;
    font-size:17px;
    font-weight:850;
    color:#f8fafc;
}

.product-price{
    font-size:15px;
    font-weight:850;
    color:#c4b5fd;
}

.row,
.summary-row{
    display:flex;
    justify-content:space-between;
    gap:20px;
    padding:9px 0;
    color:#94a3b8;
}

.total,
.row.total{
    margin:10px 28px 0;
    padding:22px 0 26px;
    display:flex;
    justify-content:space-between;
    color:#fff;
    font-size:20px;
    font-weight:900;
    border-top:1px solid rgba(255,255,255,.1);
}

.total strong,
.row.total strong{
    color:#c4b5fd;
}

.feedback-btn{
    border:0;
    padding:9px 14px;
    border-radius:10px;
    color:#fff;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    transition:.25s;
}

.feedback-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(124,58,237,.3);
}

.feedback-box{
    display:none;
    margin-top:14px;
    padding:17px;
    border:1px solid rgba(251,191,36,.2);
    border-radius:15px;
    background:rgba(15,23,42,.65);
}

.feedback-box.show{
    display:block;
    animation:fadeUp .3s ease;
}

.feedback-stars{
    display:flex;
    gap:5px;
    margin:12px 0;
}

.feedback-star{
    cursor:pointer;
    font-size:25px;
    color:#475569;
    transition:.2s;
}

.feedback-star.active{
    color:#fbbf24;
    transform:scale(1.08);
}

.feedback-text{
    width:100%;
    min-height:90px;
    padding:13px;
    resize:vertical;
    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;
    outline:none;
    color:#fff;
    background:rgba(2,6,23,.7);
}

.feedback-text:focus{
    border-color:#8b5cf6;
    box-shadow:0 0 0 3px rgba(139,92,246,.12);
}

.feedback-submit{
    margin-top:10px;
    padding:10px 16px;
    border:0;
    border-radius:10px;
    color:#fff;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    font-weight:800;
    cursor:pointer;
}

.feedback-done{
    margin-top:10px;
    color:#86efac;
    font-weight:700;
}

.order>div:last-child{
    color:#cbd5e1;
}

@keyframes fadeUp{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:translateY(0)}
}

@media(max-width:700px){
    header{
        padding:18px 5%;
    }

    nav{
        gap:15px;
        flex-wrap:wrap;
        padding:14px 5%;
    }

    nav a{
        font-size:12px;
    }

    main,
    .container{
        width:94%;
        padding:35px 0 60px;
    }

    h1{
        font-size:38px;
    }

    .order-header,
    .order-head{
        align-items:flex-start;
        flex-direction:column;
        padding:21px;
    }

    .delivery-info{
        margin:18px;
        padding:17px;
        overflow-x:auto;
    }

    .delivery-timeline{
        min-width:620px;
    }

    .product{
        margin:0 18px;
        gap:12px;
        flex-wrap:wrap;
    }

    .product-image{
        width:70px;
        height:70px;
    }

    .product-name{
        min-width:calc(100% - 90px);
    }

    .product-price{
        margin-left:82px;
    }

    .total,
    .row.total{
        margin-left:18px;
        margin-right:18px;
    }
}
</style>

        padding:14px 5%;
    }

    nav a{
        font-size:12px;
    }

    main,
    .container{
        width:94%;
        padding:35px 0 60px;
    }

    h1{
        font-size:38px;
    }

    .order-header,
    .order-head{
        align-items:flex-start;
        flex-direction:column;
        padding:21px;
    }

    .delivery-info{
        margin:18px;
        padding:17px;
        overflow-x:auto;
    }

    .delivery-timeline{
        min-width:620px;
    }

    .product{
        margin:0 18px;
        gap:12px;
        flex-wrap:wrap;
    }

    .product-image{
        width:70px;
        height:70px;
    }

    .product-name{
        min-width:calc(100% - 90px);
    }

    .product-price{
        margin-left:82px;
    }

    .total,
    .row.total{
        margin-left:18px;
        margin-right:18px;
    }
}
</style>
</style></head>

<body>

<header>

<div class="logo">
AuraMart
</div>

<nav>
<a href="index.html">Home</a>
<a href="products">Products</a>
<a href="cart.html">Cart</a>
<a href="orders.html">Orders</a>
<a href="login.html">Login</a>
</nav>

</header>

<div class="container">

<h1>My Orders</h1><p>Track your purchases, delivery status and order details</p>

<div id="welcome"></div>

<div id="orders">
    <div class="loading">
        Loading your orders...
    </div>
</div>

</div>

<script>

const ordersContainer =
    document.getElementById("orders");

const welcomeContainer =
    document.getElementById("welcome");


function money(value){

    return Number(value || 0)
        .toLocaleString("en-IN");

}


function showEmpty(){

    ordersContainer.innerHTML = `

        <div class="empty">

            <h2>No orders yet</h2>

            <p>
                Your placed orders will appear here.
            </p>

            <a
                href="products"
                class="shop"
            >
                Continue Shopping
            </a>

        </div>

    `;

}


function getExpectedDelivery(createdAt){

    if(!createdAt){
        return "Delivery date unavailable";
    }

    const date = new Date(createdAt);

    if(isNaN(date.getTime())){
        return "Delivery date unavailable";
    }

    // AuraMart standard delivery: 5 days
    date.setDate(date.getDate() + 5);

    return date.toLocaleDateString("en-IN", {
        day: "2-digit",
        month: "long",
        year: "numeric"
    });
}


function getDeliveryTimeline(status){

    const currentStatus =
        String(status || "PLACED")
            .trim()
            .toUpperCase();

    const steps = [
        "PLACED",
        "CONFIRMED",
        "PROCESSING",
        "SHIPPED",
        "OUT FOR DELIVERY",
        "DELIVERED"
    ];

    let currentIndex = steps.indexOf(currentStatus);

    if(currentIndex < 0){
        currentIndex = 0;
    }

    return steps.map(function(step, index){

        let icon = "○";
        let className = "";

        if(index < currentIndex){
            icon = "✓";
            className = "completed";
        }
        else if(index === currentIndex){
            icon = "—";
            className = "active";
        }

        return `
            <div class="delivery-step ${className}">
                <div class="delivery-icon">${icon}</div>
                <div class="delivery-label">${step}</div>
            </div>
        `;

    }).join("");
}

function renderOrders(data){

    if(!data.orders ||
       data.orders.length === 0){

        showEmpty();

        return;
    }


    ordersContainer.innerHTML = "";


    data.orders.forEach(function(order){

        let productsHTML = "";


        (order.items || []).forEach(
            function(item){

                const quantity =
                    Number(item.quantity) || 1;

                const price =
                    Number(item.price) || 0;

                const itemTotal =
                    price * quantity;


                productsHTML += `

                    <div class="product">

                        <div>

                            <div class="product-name">
                                ${item.name || "Product"}
                            </div>

                            <small>
                                Rs. ${money(price)}
                                x ${quantity}
                            </small>

                        </div>

                        <div>
                            <div class="product-price">
                                Rs. ${money(itemTotal)}
                            </div>

                            <button
                                class="feedback-btn"
                                onclick="openFeedback('${order.orderId}', '${item.productId || ""}', this)">
                            Give Feedback
                            </button>

                            <div class="feedback-box">

                                <strong>How was this product?</strong>

                                <div class="feedback-stars">
                                    <span class="feedback-star" onclick="setRating(this,1)">★</span>
                                    <span class="feedback-star" onclick="setRating(this,2)">★</span>
                                    <span class="feedback-star" onclick="setRating(this,3)">★</span>
                                    <span class="feedback-star" onclick="setRating(this,4)">★</span>
                                    <span class="feedback-star" onclick="setRating(this,5)">★</span>
                                </div>

                                <textarea
                                    class="feedback-text"
                                    placeholder="Write your feedback..."></textarea>

                                <button
                                    class="feedback-submit"
                                    onclick="submitFeedback(this)">
                                    Submit Feedback
                                </button>

                                <div class="feedback-done"></div>

                            </div>
                        </div>

                    </div>

                `;

            }
        );


        const customer =
            order.customer || {};

        const expectedDelivery =
            getExpectedDelivery(order.createdAt);

        const currentStatus =
            String(order.status || "PLACED")
                .trim()
                .toUpperCase();

        const deliveryTimeline =
            getDeliveryTimeline(currentStatus);


        ordersContainer.innerHTML += `

            <div class="order">

                <div class="order-header">

                    <div>

                        <div class="order-id">
                            Order ID: ${order.orderId}
                        </div>

                        <small>
                            ${order.createdAt || ""}
                        </small>

                    </div>

                    <div class="status">
                        ${order.status || "PLACED"}
                    </div>

                    <div class="delivery-info">

                        <div class="delivery-title">
                            Delivery Information
                        </div>

                        <div class="expected-delivery">
                            Expected Delivery:
                            <strong>${expectedDelivery}</strong>
                        </div>

                        <div class="delivery-timeline">
                            ${deliveryTimeline}
                        </div>

                        ${
                            currentStatus === "DELIVERED"
                            ?
                            `
                            <div class="delivered-message">
                                Order Delivered Successfully
                            </div>
                            `
                            :
                            ""
                        }

                    </div>

                </div>


                <div class="customer-box">

                    <h3>
                        Delivery Details
                    </h3>

                    <p>
                        <strong>Name:</strong>
                        ${customer.name || ""}
                    </p>

                    <p>
                        <strong>Email:</strong>
                        ${customer.email || ""}
                    </p>

                    <p>
                        <strong>Phone:</strong>
                        ${customer.phone || ""}
                    </p>

                    <p>
                        <strong>Address:</strong>
                        ${order.address || ""}
                    </p>

                </div>


                <h3 style="margin-bottom:10px;">
                    Products
                </h3>

                ${productsHTML}


                <div class="total">

                    Subtotal:
                    Rs. ${money(order.subtotal)}
                    <br>

                    Delivery:
                    Rs. ${money(order.deliveryCharge)}
                    <br>

                    Service:
                    Rs. ${money(order.serviceCharge)}
                    <br>

                    <strong>
                        Total:
                        Rs. ${money(order.total)}
                    </strong>

                </div>

            </div>

        `;

    });

}


/* Clear cart only after successful order */
const orderParams =
    new URLSearchParams(
        window.location.search
    );

if(
    orderParams.get("success") === "true"
){
    localStorage.removeItem(
        "auraMartCart"
    );

    localStorage.removeItem(
        "auraMartCheckout"
    );
}
fetch(
    "orders-data",
    {
        method:"GET",
        credentials:"include",
        cache:"no-store"
    }
)
.then(function(response){

    if(response.status === 401){

        throw new Error("LOGIN_REQUIRED");
    }

    if(!response.ok){

        throw new Error("ORDER_DATA_ERROR");
    }

    return response.json();

})
.then(function(data){

    welcomeContainer.innerHTML = `

        <div class="welcome">

            Welcome,
            <strong>${data.user.name}</strong>
            (${data.user.email})

        </div>

    `;


    renderOrders(data);

})
.catch(function(error){

    console.error(error);

    if(error.message === "LOGIN_REQUIRED"){

        ordersContainer.innerHTML = `

            <div class="empty">

                <h2>Please login</h2>

                <p>
                    Login to view your orders.
                </p>

                <a
                    href="login.html"
                    class="shop"
                >
                    Login Now
                </a>

            </div>

        `;

        return;
    }


    showEmpty();

});

</script>


<script>

let selectedRating = 0;

function openFeedback(orderId, productId, button){

    const box = button.nextElementSibling;

    box.classList.toggle("show");

    box.dataset.orderId = orderId;
    box.dataset.productId = productId;
}

function setRating(star, rating){

    selectedRating = rating;

    const box = star.closest(".feedback-box");
    const stars = box.querySelectorAll(".feedback-star");

    stars.forEach(function(s,index){

        s.classList.toggle(
            "active",
            index < rating
        );

    });

}

function submitFeedback(button){

    const box = button.closest(".feedback-box");

    const text =
        box.querySelector(".feedback-text").value.trim();

    const orderId =
        box.dataset.orderId;

    const productId =
        box.dataset.productId;

    if(selectedRating === 0){

        alert("Please select a rating");
        return;

    }

    if(text === ""){

        alert("Please write your feedback.");
        return;

    }

    const feedback = {

        orderId: orderId,
        productId: productId,
        rating: selectedRating,
        comment: text,
        date: new Date().toISOString()

    };

    const allFeedback =
        JSON.parse(
            localStorage.getItem("auraMartFeedback") || "[]"
        );

    allFeedback.push(feedback);

    localStorage.setItem(
        "auraMartFeedback",
        JSON.stringify(allFeedback)
    );

    box.querySelector(".feedback-done").textContent =
        "✓ Feedback submitted successfully! Thank you";

    button.style.display = "none";

    box.querySelector(".feedback-text").disabled = true;

    box.querySelectorAll(".feedback-star").forEach(
        function(s){
            s.style.pointerEvents = "none";
        }
    );

}

</script>
</body>

</html>
