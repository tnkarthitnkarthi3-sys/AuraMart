<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuraMart | Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Inter,Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:#fff;
    background:
        radial-gradient(circle at 15% 20%,rgba(124,58,237,.30),transparent 30%),
        radial-gradient(circle at 85% 80%,rgba(37,99,235,.28),transparent 32%),
        linear-gradient(135deg,#030712,#0b1024 48%,#111936);
    position:relative;
}

body:before{
    content:"";
    position:fixed;
    inset:-100px;
    background:
        repeating-linear-gradient(
            110deg,
            rgba(255,255,255,.035) 0px,
            rgba(255,255,255,.035) 1px,
            transparent 1px,
            transparent 7px
        ),
        repeating-linear-gradient(
            20deg,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 1px,
            transparent 1px,
            transparent 9px
        );
    opacity:.7;
    transform:rotate(-3deg) scale(1.2);
    pointer-events:none;
}

.orb{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    filter:blur(8px);
}

.orb.one{
    width:320px;
    height:320px;
    background:rgba(124,58,237,.22);
    top:-110px;
    left:-80px;
    animation:floatOne 9s ease-in-out infinite;
}

.orb.two{
    width:380px;
    height:380px;
    background:rgba(37,99,235,.18);
    bottom:-170px;
    right:-110px;
    animation:floatTwo 11s ease-in-out infinite;
}

.orb.three{
    width:170px;
    height:170px;
    background:rgba(236,72,153,.12);
    top:45%;
    right:12%;
    animation:floatThree 7s ease-in-out infinite;
}

@keyframes floatOne{
    0%,100%{
        transform:translate(0,0) scale(1);
    }
    50%{
        transform:translate(80px,55px) scale(1.12);
    }
}

@keyframes floatTwo{
    0%,100%{
        transform:translate(0,0);
    }
    50%{
        transform:translate(-60px,-45px);
    }
}

@keyframes floatThree{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-45px);
    }
}

.login-box{
    position:relative;
    z-index:5;
    width:min(430px,92vw);
    padding:42px 38px;
    border-radius:32px;
    background:rgba(255,255,255,.075);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(28px);
    -webkit-backdrop-filter:blur(28px);
    box-shadow:
        0 30px 90px rgba(0,0,0,.50),
        inset 0 1px 0 rgba(255,255,255,.12);
    animation:cardEnter .8s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardEnter{
    from{
        opacity:0;
        transform:translateY(35px) scale(.96);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.logo-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:18px;
}

.logo{
    width:72px;
    height:72px;
    border-radius:23px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    font-weight:800;
    color:#fff;
    background:linear-gradient(135deg,#8b5cf6,#2563eb);
    box-shadow:
        0 12px 35px rgba(99,102,241,.40),
        inset 0 1px 1px rgba(255,255,255,.30);
    animation:logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat{
    0%,100%{
        transform:translateY(0) rotate(0);
    }
    50%{
        transform:translateY(-5px) rotate(1deg);
    }
}

.title{
    text-align:center;
    font-size:27px;
    font-weight:800;
    letter-spacing:-.6px;
}

.subtitle{
    text-align:center;
    margin-top:8px;
    margin-bottom:28px;
    color:rgba(255,255,255,.62);
    font-size:14px;
    line-height:1.5;
}

label{
    display:block;
    margin:17px 0 8px;
    color:rgba(255,255,255,.82);
    font-size:13px;
    font-weight:600;
}

.input-wrap{
    position:relative;
}

.input-icon{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    opacity:.55;
    font-size:16px;
    pointer-events:none;
}

input,
select{
    width:100%;
    height:52px;
    padding:0 15px 0 43px;
    border:1px solid rgba(255,255,255,.13);
    border-radius:16px;
    outline:none;
    font-family:inherit;
    font-size:14px;
    color:#fff;
    background:rgba(255,255,255,.065);
    transition:.3s ease;
}

select{
    cursor:pointer;
}

select option{
    background:#111936;
    color:#fff;
}

input::placeholder{
    color:rgba(255,255,255,.38);
}

input:focus,
select:focus{
    border-color:rgba(129,140,248,.85);
    background:rgba(255,255,255,.10);
    box-shadow:
        0 0 0 4px rgba(99,102,241,.12),
        0 8px 25px rgba(0,0,0,.15);
    transform:translateY(-1px);
}

.role-hint{
    margin-top:8px;
    font-size:11px;
    color:rgba(255,255,255,.45);
    padding-left:3px;
}

button{
    width:100%;
    height:54px;
    margin-top:27px;
    border:0;
    border-radius:17px;
    color:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    background:linear-gradient(135deg,#8b5cf6,#4f46e5,#2563eb);
    box-shadow:
        0 12px 30px rgba(79,70,229,.30),
        inset 0 1px 1px rgba(255,255,255,.25);
    transition:.3s ease;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:
        0 18px 38px rgba(79,70,229,.42),
        inset 0 1px 1px rgba(255,255,255,.25);
}

button:active{
    transform:scale(.98);
}

.register{
    text-align:center;
    margin-top:23px;
    color:rgba(255,255,255,.48);
    font-size:13px;
}

.register a{
    color:#a5b4fc;
    text-decoration:none;
    font-weight:700;
    margin-left:4px;
}

.register a:hover{
    color:#fff;
}

.home{
    display:block;
    text-align:center;
    margin-top:17px;
    color:rgba(255,255,255,.42);
    text-decoration:none;
    font-size:12px;
    transition:.2s;
}

.home:hover{
    color:#fff;
}

.error,
.success{
    margin-top:18px;
    padding:12px 14px;
    border-radius:13px;
    text-align:center;
    font-size:12px;
    animation:messageIn .4s ease;
}

.error{
    background:rgba(239,68,68,.13);
    border:1px solid rgba(248,113,113,.25);
    color:#fecaca;
}

.success{
    background:rgba(34,197,94,.13);
    border:1px solid rgba(74,222,128,.25);
    color:#bbf7d0;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(-5px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:500px){
    body{
        overflow:auto;
        padding:25px 0;
    }

    .login-box{
        padding:34px 24px;
        border-radius:27px;
    }

    .title{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="orb one"></div>
<div class="orb two"></div>
<div class="orb three"></div>

<div class="login-box">

    <div class="logo-wrap">
        <div class="logo">A</div>
    </div>

    <div class="title">
        Welcome Back
    </div>

    <div class="subtitle" id="subtitle">
        Sign in to continue your AuraMart experience
    </div>

    <form action="login" method="post">

        <input
            type="hidden"
            id="checkout"
            name="checkout"
            value="false"
        >

        <label for="role">
            Account Type
        </label>

        <div class="input-wrap">

            <span class="input-icon">◈</span>

            <select
                id="role"
                name="role"
                required
            >
                <option value="BUYER">
                    Customer
                </option>

                <option value="SELLER">
                    Seller
                </option>
            </select>

        </div>

        <div class="role-hint" id="roleHint">
            Shop products and manage your orders.
        </div>

        <label for="email">
            Email Address
        </label>

        <div class="input-wrap">

            <span class="input-icon">✉</span>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

        </div>

        <label for="password">
            Password
        </label>

        <div class="input-wrap">

            <span class="input-icon">●</span>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

        </div>

        <button
            type="submit"
            id="loginButton"
        >
            Login as Customer
        </button>

    </form>

    <div id="message"></div>

    <div class="register">
        New to AuraMart?
        <a href="register.html">
            Create Account
        </a>
    </div>

    <a href="index.html" class="home">
        ← Back to AuraMart
    </a>

</div>

<script>

const params =
    new URLSearchParams(window.location.search);

const message =
    document.getElementById("message");

const checkoutField =
    document.getElementById("checkout");

const roleSelect =
    document.getElementById("role");

const roleHint =
    document.getElementById("roleHint");

const loginButton =
    document.getElementById("loginButton");

const subtitle =
    document.getElementById("subtitle");

if(params.get("checkout") === "true"){
    checkoutField.value = "true";
}

function updateRoleUI(){

    const role = roleSelect.value;

    if(role === "SELLER"){

        subtitle.innerText =
            "Sign in to manage your AuraMart store";

        roleHint.innerText =
            "Manage products, orders and your seller dashboard.";

        loginButton.innerText =
            "Login as Seller";

    }else{

        subtitle.innerText =
            "Sign in to continue your AuraMart experience";

        roleHint.innerText =
            "Shop products and manage your orders.";

        loginButton.innerText =
            "Login as Customer";
    }
}

roleSelect.addEventListener(
    "change",
    updateRoleUI
);

updateRoleUI();

if(params.get("error") === "invalid"){

    message.className = "error";

    message.innerText =
        "Invalid email or password.";
}

if(params.get("error") === "validation"){

    message.className = "error";

    message.innerText =
        "Please enter your email and password.";
}

if(params.get("registered") === "true"){

    message.className = "success";

    message.innerText =
        "Account created successfully. Please login.";
}

</script>

</body>
</html>
