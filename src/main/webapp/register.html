<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AuraMart | Create Account</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#eef2ff,#f8fafc);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{
    width:100%;
    max-width:900px;
    display:grid;
    grid-template-columns:1fr 1fr;
    background:white;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(15,23,42,.15);
}

.left{
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    color:white;
    padding:55px 40px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.left h1{
    font-size:42px;
    margin-bottom:15px;
}

.left p{
    font-size:17px;
    line-height:1.7;
    opacity:.9;
}

.features{
    margin-top:35px;
}

.feature{
    margin:18px 0;
    font-size:15px;
}

.right{
    padding:40px;
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#4f46e5;
    margin-bottom:5px;
}

.subtitle{
    color:#64748b;
    margin-bottom:25px;
}

label{
    display:block;
    margin:14px 0 7px;
    color:#334155;
    font-weight:bold;
    font-size:14px;
}

input,textarea{
    width:100%;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    font-size:14px;
    outline:none;
}

input:focus,textarea:focus{
    border-color:#4f46e5;
    box-shadow:0 0 0 3px rgba(79,70,229,.1);
}

textarea{
    resize:none;
    height:75px;
}

button{
    width:100%;
    padding:14px;
    margin-top:22px;
    border:0;
    border-radius:10px;
    background:#4f46e5;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#3730a3;
}

.login{
    text-align:center;
    margin-top:20px;
    color:#64748b;
    font-size:14px;
}

.login a{
    color:#4f46e5;
    text-decoration:none;
    font-weight:bold;
}

.home{
    display:block;
    text-align:center;
    margin-top:15px;
    color:#64748b;
    text-decoration:none;
    font-size:14px;
}

@media(max-width:700px){
    .container{
        grid-template-columns:1fr;
    }

    .left{
        display:none;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="left">

        <h1>AuraMart</h1>

        <p>
            Your smart and simple online shopping destination.
            Create your account and start shopping today.
        </p>

        <div class="features">

            <div class="feature">? Easy & Secure Registration</div>
            <div class="feature">? Fast Shopping Experience</div>
            <div class="feature">? Track Your Orders</div>
            <div class="feature">? Personalized Customer Account</div>

        </div>

    </div>

    <div class="right">

        <div class="logo">Create Account</div>

        <div class="subtitle">
            Join AuraMart today
        </div>

        <form action="register" method="post">

            <label for="name">Full Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="phone">Phone Number</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <label for="confirmPassword">Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm your password"
                required
            >

            <label for="address">Delivery Address</label>

            <textarea
                id="address"
                name="address"
                placeholder="Enter your delivery address"
                required
            ></textarea>

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="login">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

        <a href="index.html" class="home">
            ? Back to Home
        </a>

    </div>

</div>

<script>

document.querySelector("form").addEventListener("submit", function(event){

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if(password !== confirmPassword){

        event.preventDefault();

        alert("Passwords do not match!");

    }

});

</script>

</body>
</html>
